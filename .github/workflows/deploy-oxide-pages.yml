name: Deploy OXIDE to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'oxide-github-pages-upload'
      - '.github/workflows/deploy-oxide-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract OXIDE site bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle public/pkg
          unzip -q oxide-github-pages-upload -d bundle

          test -s bundle/index.html
          test -s bundle/pkg/oxide_wasm.js
          test -s bundle/pkg/oxide_wasm_bg.wasm

          cp bundle/index.html public/index.html
          cp -a bundle/pkg/. public/pkg/
          touch public/.nojekyll

          echo "Published files:"
          find public -maxdepth 2 -type f -printf '%p (%s bytes)\n' | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
